# ── HTTP → HTTPS redirect ─────────────────────────────────
server {
    listen 80;
    server_name bookstore.shop www.bookstore.shop;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name bookstore.shop www.bookstore.shop;

    ssl_certificate     /etc/nginx/ssl/bookstore.crt;
    ssl_certificate_key /etc/nginx/ssl/bookstore.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    resolver 10.1.0.10 valid=30s;

    # ── Laravel SSR (Blade) ───────────────────────────────
    location = / {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/catalog {
        try_files $uri /index.php?$query_string;
    }

    # ── API + Webhooks → Laravel ──────────────────────────
    location ~ ^/api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/webhooks {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/docs {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Vite deps ─────────────────────────────────────────
    location ~ ^/node_modules/ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host frontend:5173;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /@vite/ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host frontend:5173;
    }

    # ── Static Laravel storage ────────────────────────────
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Vite build assets (CSS/JS compilado para Blade) ──────
    location /build/ {
        root /var/www/html/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Vue CSR (todo lo demás → Vite) ───────────────────
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host frontend:5173;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Denegar archivos ocultos ──────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}