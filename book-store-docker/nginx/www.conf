# ── Webhooks por IP (stripe-cli interno) ──────────────────
server {
    listen 443 ssl;
    server_name 10.1.0.20;

    ssl_certificate     /etc/nginx/ssl/bookstore.crt;
    ssl_certificate_key /etc/nginx/ssl/bookstore.key;

    location /api/v1/webhooks/stripe {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass          app:9000;
        fastcgi_index         index.php;
        fastcgi_param         SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include               fastcgi_params;
        fastcgi_read_timeout  300;
    }

    root /var/www/html/public;
}

server {
    listen 80;
    server_name bookstore.shop www.bookstore.shop;
    return 301 https://$host$request_uri;
}

# www → sin-www
server {
    listen 443 ssl;
    server_name www.bookstore.shop;
    ssl_certificate     /etc/nginx/ssl/bookstore.crt;
    ssl_certificate_key /etc/nginx/ssl/bookstore.key;
    return 301 https://bookstore.shop$request_uri;
}

# Principal
server {
    listen 443 ssl;
     server_name bookstore.shop localhost 127.0.0.1;
    ssl_certificate     /etc/nginx/ssl/bookstore.crt;
    ssl_certificate_key /etc/nginx/ssl/bookstore.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    resolver 10.1.0.10 valid=30s;

    # ── Laravel SSR (Blade) ───────────────────────────────
    location = / {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/catalog {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/api {
    # CORS preflight
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'https://www.bookstore.shop' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, X-XSRF-TOKEN' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' 'https://www.bookstore.shop' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    try_files $uri $uri/ /index.php?$query_string;
}

    location ~ ^/webhooks {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/docs {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass          app:9000;
        fastcgi_index         index.php;
        fastcgi_param         SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include               fastcgi_params;
        fastcgi_read_timeout  300;
        fastcgi_buffer_size   16k;
        fastcgi_buffers       4 16k;
    }

    # ── Vite deps ─────────────────────────────────────────
    location ~ ^/node_modules/ {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host       frontend:5173;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    location /@vite/ {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       frontend:5173;
    }

    # ── Static Laravel storage ────────────────────────────
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log  off;
        expires     30d;
        add_header  Cache-Control "public";
    }

    # ── Vite build assets (CSS/JS compilado para Blade) ───
    location /build/ {
        root        /var/www/html/public;
        access_log  off;
        expires     30d;
        add_header  Cache-Control "public";
    }

    # ── Vue CSR (todo lo demás → Vite) ───────────────────
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               frontend:5173;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # ── Denegar archivos ocultos ──────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}